[project]
name = "pipeguard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
]

[tool.pytest.ini_options]
testpaths = ["apps/pipeguard/tests"]
pythonpath = ["apps/pipeguard/src"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
