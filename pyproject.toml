[project]
name = "pipeguard"
version = "0.1.0"
requires-python = ">=3.12.16,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.35,<1",
]

[tool.pytest.ini_options]
testpaths = ["apps/pipeguard/tests"]
pythonpath = ["apps/pipeguard/src"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]
