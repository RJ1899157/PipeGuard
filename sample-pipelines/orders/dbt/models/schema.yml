version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, cancelled]
  - name: orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: order_total
        data_tests: [not_null]
  - name: daily_revenue
    columns:
      - name: order_date
        data_tests: [not_null, unique]
      - name: revenue
        data_tests: [not_null]
