[project]
name = "pipeguard-orders-sample"
version = "0.1.0"
requires-python = ">=3.12.16,<3.13"
dependencies = [
    "dbt-core>=1.10,<1.13",
    "dbt-postgres>=1.9,<1.11",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
