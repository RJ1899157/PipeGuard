name: Delivery checks

# Manual until the owner confirms the private-repository Actions allowance.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Application, workload and Airflow
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the reviewed uv version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
          enable-cache: false
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Verify a fresh isolated export
        run: uv run --locked python scripts/check_delivery.py --suite python

  web:
    name: Dashboard types, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
          package-manager-cache: false
      - name: Install the locked pnpm version
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.25.0"
          run_install: false
      - name: Verify a fresh dashboard export
        run: python3 scripts/check_delivery.py --suite web
