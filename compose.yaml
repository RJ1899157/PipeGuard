services:
  postgres:
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PIPEGUARD_OWNER_PASSWORD: ${PIPEGUARD_OWNER_PASSWORD:?Set PIPEGUARD_OWNER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PIPEGUARD_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-pipeguard.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipeguard"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
