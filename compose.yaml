services:
  postgres:
    image: pipeguard-postgres:17.11-apt3.0.4
    build: ./infra/postgres
    pull_policy: build
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PIPEGUARD_OWNER_PASSWORD: ${PIPEGUARD_OWNER_PASSWORD:?Set PIPEGUARD_OWNER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PIPEGUARD_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-pipeguard.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipeguard"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
